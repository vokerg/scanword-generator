name: Phase 12 exact allocator top-three

on:
  push:
    branches:
      - "agent/phase-12-linear-top-three-selector"
  pull_request:
    branches:
      - main
    paths:
      - "construction-exact-allocator-top-three-v1.js"
      - "index.html"
      - "tools/construction-pipeline-seed-v1.cjs"
      - "tools/exact-allocator-top-three-test-v1.cjs"
      - "tools/exact-allocator-top-three-checkpoint-v1.cjs"
      - "tools/node-benchmark-bootstrap-v1.cjs"
      - "research/exact-allocator-acceleration/linear-top-three-selector.md"
      - ".github/workflows/phase-12-exact-allocator-top-three.yml"
  workflow_dispatch:

concurrency:
  group: phase-12-exact-allocator-top-three-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-selector-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check selector syntax and default-off boundary
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          node --check construction-exact-allocator-top-three-v1.js
          node --check tools/construction-pipeline-seed-v1.cjs
          node --check tools/exact-allocator-top-three-test-v1.cjs
          node --check tools/exact-allocator-top-three-checkpoint-v1.cjs
          node --check tools/node-benchmark-bootstrap-v1.cjs
          grep -q 'SCANWORD_EXACT_ALLOCATOR_SELECTOR = "off"' index.html
          grep -q 'construction-exact-allocator-top-three-v1.js' index.html
          grep -q 'construction-exact-allocator-top-three-v1.js' tools/node-benchmark-bootstrap-v1.cjs

      - name: Prove stable-prefix and allocator parity
        env:
          SCANWORD_BULK_LEXICON: "off"
        run: >-
          NODE_OPTIONS=--require=./tools/node-benchmark-bootstrap-v1.cjs
          node tools/exact-allocator-top-three-test-v1.cjs

  stability-selector-profile:
    if: github.event_name == 'workflow_dispatch'
    needs: exact-selector-parity
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ github.sha }}
      SCANWORD_EXACT_ALLOCATOR_SELECTOR_CONCURRENCY: 4
      SCANWORD_EXACT_ALLOCATOR_SELECTOR_SEED_TIMEOUT_MS: 7200000
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare frozen stability-100
        run: |
          set -o pipefail
          mkdir -p research-output/exact-allocator-acceleration
          node tools/exact-allocator-top-three-checkpoint-v1.cjs \
            stability \
            research-output/exact-allocator-acceleration/stability-top-three-v1.jsonl \
            | tee research-output/exact-allocator-acceleration/stability-top-three-console-v1.jsonl

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-12-exact-allocator-top-three-stability-${{ env.SOURCE_SHA }}
          path: research-output/exact-allocator-acceleration/
          if-no-files-found: error