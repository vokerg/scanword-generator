name: Browser release smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.js"
      - "bulk-lexicon/**"
      - "index.html"
      - "styles.css"
      - "tools/node-benchmark-bootstrap-v1.cjs"
      - "tools/construction-pipeline-seed-v1.cjs"
      - "tools/wrapper-retirement-test-v1.cjs"
      - "tools/production-release-smoke-v1.cjs"
      - "tools/build-static-release-v1.cjs"
      - "tools/verify-static-release-v1.cjs"
      - "tools/browser-release-smoke-v1.cjs"
      - ".github/workflows/browser-release-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "*.js"
      - "bulk-lexicon/**"
      - "index.html"
      - "styles.css"
      - "tools/node-benchmark-bootstrap-v1.cjs"
      - "tools/construction-pipeline-seed-v1.cjs"
      - "tools/wrapper-retirement-test-v1.cjs"
      - "tools/production-release-smoke-v1.cjs"
      - "tools/build-static-release-v1.cjs"
      - "tools/verify-static-release-v1.cjs"
      - "tools/browser-release-smoke-v1.cjs"
      - ".github/workflows/browser-release-smoke.yml"
  workflow_dispatch:

concurrency:
  group: browser-release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser smoke tooling
        run: |
          node --check tools/browser-release-smoke-v1.cjs
          node --check tools/build-static-release-v1.cjs
          node --check tools/verify-static-release-v1.cjs

      - name: Re-run canonical production release smoke
        run: |
          set -o pipefail
          mkdir -p release-output
          node tools/production-release-smoke-v1.cjs \
            | tee release-output/production-release-smoke-v1.jsonl

      - name: Build and verify exact static site
        run: |
          set -o pipefail
          node tools/build-static-release-v1.cjs release/browser-smoke-site \
            | tee release-output/build-browser-smoke-site-v1.jsonl
          node tools/verify-static-release-v1.cjs release/browser-smoke-site \
            | tee release-output/verify-browser-smoke-site-v1.jsonl

      - name: Locate installed headless browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER_BIN="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$BROWSER_BIN"
          echo "SCANWORD_BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version | tee release-output/browser-version.txt

      - name: Verify packaged app in a real browser
        run: |
          set -o pipefail
          node tools/browser-release-smoke-v1.cjs release/browser-smoke-site \
            | tee release-output/browser-release-smoke-v1.jsonl

      - name: Upload browser release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-output/
          if-no-files-found: warn
